# DNS Sinkhole / Caching Resolver Configuration
# All settings can be overridden by command-line flags.

[server]
# Listen address and port (use 127.0.0.1 to avoid admin rights)
listen_address = "127.0.0.1"
listen_port = 5353

# Dashboard HTTP server
dashboard_port = 8080

# Concurrency: number of worker threads for handling queries
worker_threads = 8

# TCP settings
tcp_idle_timeout = 30        # seconds before closing idle TCP connection
max_tcp_connections = 50     # maximum concurrent TCP connections

[upstream]
# Primary upstream resolver
primary = "8.8.8.8"
# Failover upstream resolver (optional)
secondary = "8.8.4.4"
# Port for upstream queries
port = 53
# Timeout per attempt in seconds
timeout = 2.0
# Number of retries before giving up
retries = 2

[cache]
# Maximum cache entries (LRU eviction when full)
max_entries = 10000
# Maximum negative cache TTL in seconds (RFC 2308 cap)
max_negative_ttl = 300
# Minimum TTL floor (don't cache below this)
min_ttl = 0

[blocklist]
# Paths to blocklist files (relative to project root or absolute)
hosts_files = ["blocklists/sample_hosts.txt"]
domain_files = ["blocklists/sample_domains.txt"]
# Block response mode: "null" (A->0.0.0.0, AAAA->::) or "nxdomain"
block_mode = "null"
# TTL for blocked responses in seconds
block_ttl = 60

[logging]
# Log file path (relative or absolute)
log_file = "dns_sinkhole.log"
# Maximum log file size in bytes before rotation
max_bytes = 10485760  # 10 MB
# Number of backup log files to keep
backup_count = 5
# Log level: DEBUG, INFO, WARNING, ERROR
level = "INFO"

[edns]
# Maximum EDNS0 UDP payload size we advertise
max_udp_payload = 1232
